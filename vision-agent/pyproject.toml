[project]
name = "duolingo-vision-agent"
version = "0.1.0"
description = "Voice-only AI language teacher for Duolingo Clone Stream calls"
requires-python = ">=3.10,<3.14"
dependencies = [
  "python-dotenv>=1.1.1",
  "vision-agents==0.6.9",
  "vision-agents-plugins-deepgram==0.6.9",
  "vision-agents-plugins-elevenlabs==0.6.9",
  "vision-agents-plugins-getstream==0.6.9",
  "vision-agents-plugins-openrouter==0.6.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.0",
]

[tool.vision-agents.agent]
entrypoint = "agent:runner"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
